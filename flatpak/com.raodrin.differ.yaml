# Flatpak manifest for differ (Tauri 2 + WebKitGTK 4.1)
# App ID matches src-tauri/tauri.conf.json `identifier`.
# Built & signed in CI (.github/workflows/build-release.yml -> flatpak-bundle job).
# Runtime/maintainer: noirLang <https://github.com/noirlang/differ>
app-id: com.raodrin.differ
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: differ

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  # Git change explorer: needs to open repositories anywhere on the host.
  - --filesystem=host
  # Talk to the host for git/gpg/ssh/editors via flatpak-spawn wrappers
  # installed to /app/bin (see build-commands below).
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.gtk.vfs
  - --talk-name=org.gtk.vfs.*
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --env=RUST_BACKTRACE=1

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/differ/cargo
    npm_config_cache: /run/build/differ/npm-cache
    npm_config_prefer_offline: 'false'

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/aclocal
  - /man
  - /share/man
  - /share/gtk-doc
  - '*.la'
  - '*.a'

modules:
  - name: differ
    buildsystem: simple
    build-commands:
      - |
        set -euo pipefail
        export PATH="/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin:$PATH"
        mkdir -p "$CARGO_HOME" "$npm_config_cache"
        rustc --version
        cargo --version
        node --version
        npm --version
      - |
        set -euo pipefail
        export PATH="/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin:$PATH"
        npm ci
        node --check src/main.js
      - |
        set -euo pipefail
        export PATH="/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin:$PATH"
        # --no-bundle: only the release binary, Flatpak does the sandboxing/packaging.
        npm run tauri -- build --ci --no-bundle
        test -x src-tauri/target/release/differ
      - install -Dm755 src-tauri/target/release/differ /app/bin/differ
      - install -Dm644 flatpak/com.raodrin.differ.desktop /app/share/applications/com.raodrin.differ.desktop
      - install -Dm644 flatpak/com.raodrin.differ.metainfo.xml /app/share/metainfo/com.raodrin.differ.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.raodrin.differ.png
      - install -Dm644 src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/com.raodrin.differ.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.raodrin.differ.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/com.raodrin.differ.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.raodrin.differ.png
      - |
        set -euo pipefail
        # Host-spawn wrappers: differ shells out to git/gpg/ssh/gh/editors and
        # probes host tools (ollama, nvidia-smi, lspci, code/zed/cursor...).
        # Inside the sandbox these live on the host, so delegate via
        # `flatpak-spawn --host` and fall back to the sandbox PATH otherwise
        # (build time has no FLATPAK_ID, so SDK tools keep working).
        for tool in git gpg gpg2 ssh gh curl flatpak code code-oss zed zeditor cursor ollama nvidia-smi lspci; do
          cat > "/app/bin/${tool}" <<WRAPPER
        #!/bin/sh
        # Generated by flatpak/com.raodrin.differ.yaml - host-spawn wrapper for ${tool}.
        # Prefer the host tool so host git config/ssh-agent/gpg/editors keep working.
        if [ -n "\${FLATPAK_ID:-}" ] && command -v flatpak-spawn >/dev/null 2>&1; then
          exec flatpak-spawn --host "${tool}" "\$@"
        fi
        for d in /usr/bin /bin /usr/local/bin; do
          if [ "\$0" != "\$d/${tool}" ] && [ -x "\$d/${tool}" ]; then
            exec "\$d/${tool}" "\$@"
          fi
        done
        echo "differ (flatpak): '${tool}' not found on host nor in sandbox" >&2
        exit 127
        WRAPPER
          chmod 755 "/app/bin/${tool}"
        done
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - node_modules
          - src-tauri/target
          - src-tauri/gen
          - dist
          - release-assets
          - build-dir
          - .flatpak-builder
          - repo
          - .github
